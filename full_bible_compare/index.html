<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📖 로그인교회 전체 성경 대조 앱 (Parallel Bible Compare)</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="로그인교회 전체 성경 대조 앱 - 개역개정, 개역한글, 표준새번역 성경 구절별 병렬 대조 독서 및 검색">
  <meta name="theme-color" content="#0f172a">
  
  <!-- CSS Design System -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Master 66-Book Bible Database Loader -->
  <script src="bible_db_66.js" onload="if(window.renderBiblePassage){ window.ensureMasterDBFallbacks(); window.renderBiblePassage(); }"></script>
</head>
<body>
  <div id="app">
    <!-- Sticky Glassmorphism Navigation Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand">
          <img src="header_logo.png" alt="Login Church Logo" class="brand-logo" id="brandLogo">
          <span class="brand-title">전체 성경 대조 앱</span>
        </div>
        <div class="header-actions">
          <button class="btn-icon" id="searchBtn">🔍 검색</button>
          <button class="btn-icon" id="themeBtn">🌙 다크</button>
          <div class="font-control">
            <button class="font-btn" id="fontDecBtn">A-</button>
            <span id="fontVal" style="font-size:0.85rem; font-weight:700;">18px</span>
            <button class="font-btn" id="fontIncBtn">A+</button>
          </div>
        </div>
      </div>

      <!-- Toolbar Controls -->
      <div class="toolbar">
        <button class="picker-btn" id="pickerBtn">
          <span id="pickerBtnText">📖 창세기 1장 ▾</span>
        </button>

        <!-- View Mode Tabs -->
        <div class="view-tabs">
          <button class="view-tab active" id="viewCompareBtn">구절별 대조</button>
          <button class="view-tab" id="viewSideBtn">다단 대조</button>
          <button class="view-tab" id="viewSingleBtn">단일 역본</button>
        </div>
      </div>
    </header>

    <!-- Main Reader Canvas -->
    <main class="reader-container" id="readerCanvas">
      <div style="text-align:center; padding:50px; color:var(--text-muted);">
        <p style="font-size:1.2rem; font-weight:700; margin-bottom:8px;">📖 성경 데이터를 로딩하고 있습니다...</p>
        <p style="font-size:0.9rem;">잠시만 기다려 주시면 전체 66권 말씀이 펼쳐집니다.</p>
      </div>
    </main>

    <!-- Fixed Bottom Chapter Navigation -->
    <nav class="bottom-nav">
      <button class="nav-btn" id="prevChapterBtn">◀ 이전 장</button>
      <span style="font-weight:700; font-size:0.95rem; color:var(--accent-gold);">전체 66권 대조</span>
      <button class="nav-btn" id="nextChapterBtn">다음 장 ▶</button>
    </nav>

    <!-- Modal 1: Book & Chapter Picker -->
    <div class="modal-overlay" id="pickerModal">
      <div class="modal-card">
        <div class="modal-header">
          <span class="modal-title">📖 성경 목록 / 장 선택</span>
          <button class="btn-close" id="pickerCloseBtn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="testament-tabs">
            <button class="testament-btn active" id="tabOT">구약 39권</button>
            <button class="testament-btn" id="tabNT">신약 27권</button>
          </div>
          
          <div style="margin-bottom:12px; font-weight:700; font-size:0.95rem; color:var(--text-secondary);">1. 성경 책 선택</div>
          <div class="book-grid" id="bookGrid"></div>

          <div style="margin-top:20px; margin-bottom:12px; font-weight:700; font-size:0.95rem; color:var(--text-secondary);">2. 장 선택</div>
          <div class="book-grid" id="chapterGrid"></div>
        </div>
      </div>
    </div>

    <!-- Modal 2: Search Modal -->
    <div class="modal-overlay" id="searchModal">
      <div class="modal-card">
        <div class="modal-header">
          <span class="modal-title">🔍 전체 성경 구절 검색</span>
          <button class="btn-close" id="searchCloseBtn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="검색할 단어 입력 (예: 하나님, 사랑, 은혜)...">
            <button class="btn-icon" id="searchSubmitBtn" style="background:var(--accent-gold); color:#000; font-weight:700;">검색</button>
          </div>
          <div id="searchResults"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Core App Controller Script -->
  <script src="app.js"></script>
</body>
</html>
